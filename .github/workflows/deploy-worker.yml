name: Deploy GG Análises Esportivas

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "css/**"
      - "js/**"
      - "index.html"
      - "wrangler.toml"
      - ".assetsignore"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Publicar no Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
